[project]
name = "tabval"
version = "0.1.0"
description = "Tabular data validation using Pydantic"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "markdownmaker>=0.4.0",
  "pandas>=3.0.1",
  "pydantic>=2.12.4",
  "python-dateutil>=2.9.0.post0",
  "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
  "debugpy>=1.8.20",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.4",
  "ty>=0.0.19",
]

[tool.coverage.report]
exclude_also = [
  "class .*Protocol\\):",
  "@(abc\\.)?abstractmethod",
  "if TYPE_CHECKING:",
  "pragma: no cover",
]

[tool.pytest]
addopts = [
  "--cov-report=term-missing",
  "--cov=src",
  "--strict-markers",
  "-q",
  "-ra",
  "-v"
]
minversion = "9.0"
pythonpath = ["."]
testpaths = ["integration", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
fix = false
exclude = [
  ".git",
  ".mypy_cache",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "node_modules",
  "projects/",
  "site-packages",
  "venv",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D406",
  "D407",
  "E501",
  "ERA",
  "ERA001",
  "PLR0913",
  "PLR2004",
  "RET504",
  "T100",
  "T201",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
future-annotations = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "FBT", "PLR2004", "S311"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
